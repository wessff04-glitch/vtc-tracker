<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - VTC Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>VTC Tracker</h1>
        <h2>Connexion</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit">Se connecter</button>
        </form>
        <p id="error-message" class="error"></p>
        <p>Pas encore de compte ? <a href="inscription.html">Inscrivez-vous</a></p>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <!-- Scripts locaux -->
    <script src="auth.js"></script>
    <script src="js/app-version.js"></script>
    <script>
        // Enregistre le Service Worker et signale la disponibilité d'une nouvelle version
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                // Vérifie les mises à jour toutes les heures
                setInterval(() => reg.update(), 60 * 60 * 1000);

                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            if (confirm('Une nouvelle version est disponible. Recharger ?')) {
                                window.location.reload();
                            }
                        }
                    });
                });
            }).catch(err => console.warn('SW registration failed', err));
        }
    </script>
</body>
</html>
